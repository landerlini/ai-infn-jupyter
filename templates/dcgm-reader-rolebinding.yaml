apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-dcgm-pod-reader" .Release.Name | quote }}
  namespace: {{ .Values.dcgmExporterNamespace | default "gpu-operator" }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-jhub" .Release.Name | quote }}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jupyter-dcgm-pod-reader
