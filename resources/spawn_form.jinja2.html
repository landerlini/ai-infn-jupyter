<P>
    {{ splash_message }}
</P>

<hr><br>
<p>Docker image:
    <input list="images" name="img" value="{{ images[0].name }}"
        style="width: 80%; color: #f37524; border-color: #f37524; border-style: solid; border-radius: 4px; padding: 4px; margin-left: 5px; font-weight: bold;">
    <datalist id="images">
        {% for image in images %}
        <option value="{{ image.name }}">{{image.desc}}</option>
        {% endfor %}
    </datalist>
</p>
<br>
<p>Compute flavor:</br>
    {% for flavor in flavors %}
    <input type="radio" name="flavor" id="flavor-{{ flavor.name }}" value="{{ flavor.name }}" {{ "checked=checked" if
        flavor.default else "" }} {{ "disabled" if not flavor.enabled else "" }}>
    <label for="flavor-{{ flavor.name }}" style="width: 80%; text-weight: normal;">
        {{ flavor.desc }}
        {% if flavor.note %}
        <font style="padding-left: 10pt; color: #666; font-size: smaller; font-weight: normal; font-style: italic;">{{
            flavor.note }}</font>
        {% endif %}
    </label><br />
    {% endfor %}
</p>
<br>
